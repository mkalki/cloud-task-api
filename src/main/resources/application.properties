spring.application.name=cloud-task-api
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudtask
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Release the DB connection when the service method ends instead of holding it for the
# whole HTTP request. Lazy associations must be read inside a transaction.
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

rate-limit.capacity=100
rate-limit.refill-tokens=100
rate-limit.refill-duration-minutes=1

management.endpoints.web.exposure.include=health,prometheus
# Show each component's status (db, redis) in /actuator/health, but no details.
management.endpoint.health.show-components=always

# Roles: api, scheduler, worker. With no profile set, run as api + scheduler.
spring.profiles.default=api,scheduler

# Job limits (defaults match the PRD). See the README for what each one does.
cloudtask.jobs.max-active-per-user=1000
cloudtask.jobs.max-payload-bytes=65536
cloudtask.jobs.max-schedule-ahead-days=365

# Scheduler (profile "scheduler"): promotes due jobs and rebuilds Redis queues from PostgreSQL.
cloudtask.scheduler.enabled=true
cloudtask.scheduler.poll-interval=PT1S
cloudtask.scheduler.promote-batch-size=100
cloudtask.scheduler.reconcile-interval=PT60S
cloudtask.scheduler.reconcile-batch-size=500

# Worker (profile "worker"): claims jobs from Redis and runs them. See the README "Worker" section.
cloudtask.worker.enabled=true
cloudtask.worker.concurrency=4
cloudtask.worker.lease-ms=30000
cloudtask.worker.poll-min-ms=200
cloudtask.worker.poll-max-ms=1000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Fail fast when Redis is down instead of waiting for Lettuce's 60 s default.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
