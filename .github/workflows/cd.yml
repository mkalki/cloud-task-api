name: CloudTask CD

on:
  workflow_run:
    workflows:
      - CloudTask CI
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m

          script: |
            set -e

            cd /home/ec2-user/cloud-task-api

            git fetch origin
            git reset --hard origin/main

            echo "Pulling base images..."
            for attempt in 1 2 3; do
              if docker pull eclipse-temurin:21-jdk &&
                 docker pull eclipse-temurin:21-jre; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to pull base images"
                exit 1
              fi

              echo "Base image pull failed; retrying..."
              sleep 15
            done

            echo "Disabling BuildKit for the local-image build..."
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0

            echo "Building application image..."
            for attempt in 1 2 3; do
              if docker compose build --pull=false app; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Application image build failed"
                docker compose ps
                docker compose logs --tail=100 app || true
                exit 1
              fi

              echo "Build failed; retrying..."
              sleep 20
            done

            echo "Starting containers..."
            docker compose up -d --no-build --remove-orphans

            echo "Waiting for application health check..."
            for i in {1..24}; do
              if curl -fsS http://localhost:8080/actuator/health; then
                echo
                echo "Application is healthy"
                exit 0
              fi

              echo "Attempt $i/24: Application is not ready yet..."
              sleep 5
            done

            echo "Application failed health check"
            docker compose ps
            docker compose logs --tail=100 app || true
            exit 1